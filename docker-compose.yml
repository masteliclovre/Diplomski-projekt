services:
  

  backend:
    build: ./backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    env_file:
    - ./backend/.env
    

  frontend:
    build: ./frontend/vite-project
    container_name: vite-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

